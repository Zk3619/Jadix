
["package"]
"description" = "Winit's X11 backend"
documentation = "https://docs.rs/jadix_winit_x11"
"edition" = "2024"
"license" = "Apache-2.0"
"name" = "jadix_winit_x11"
repository = "https://github.com/Zk3619/Jadix"
"rust-version" = "1.86"
"version" = "0.31.0-beta.3-jadix.1"
"exclude" = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

readme = "README.md"
["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"all-features" = true

["features"]
"serde" = ["dep:serde", "bitflags/serde", "smol_str/serde", "dpi/serde"]

["dependencies"]

["dependencies"."bitflags"]
"version" = "2"

["dependencies"."cursor-icon"]
"version" = "1.1.0"

["dependencies"."dpi"]
"version" = "=0.1.2"

["dependencies"."rwh_06"]
"package" = "raw-window-handle"
"version" = "0.6"
"features" = ["std"]

["dependencies"."serde"]
"version" = "1"
"features" = ["serde_derive"]
"optional" = true

["dependencies"."smol_str"]
"version" = "0.3"

["dependencies"."tracing"]
"version" = "0.1.40"
"default-features" = false

["dependencies"."winit-core"]
"package" = "jadix_winit_core"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-core"

["dependencies"."bytemuck"]
"version" = "1.13.1"
"default-features" = false

["dependencies"."calloop"]
"version" = "0.14.3"

["dependencies"."libc"]
"version" = "0.2.64"

["dependencies"."percent-encoding"]
"version" = "2.0"

["dependencies"."rustix"]
"version" = "1.0.7"
"default-features" = false
"features" = ["std", "system", "thread", "process"]

["dependencies"."winit-common"]
"package" = "jadix_winit_common"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-common"
"features" = ["xkb", "x11"]

["dependencies"."x11-dl"]
"version" = "2.19.1"

["dependencies"."x11rb"]
"version" = "0.13.0"
"default-features" = false
"features" = ["allow-unsafe-code", "cursor", "dl-libxcb", "randr", "resource_manager", "sync", "xinput", "xkb"]

["dependencies"."xkbcommon-dl"]
"version" = "0.4.2"
"features" = ["x11"]

["dev-dependencies"]

["dev-dependencies"."winit"]
"package" = "jadix_winit"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../../crates/jadix_winit"

[lib]
name = "winit_x11"
