
["package"]
"description" = "Winit implementation helpers"
documentation = "https://docs.rs/jadix_winit_common"
"edition" = "2024"
"license" = "Apache-2.0"
"name" = "jadix_winit_common"
repository = "https://github.com/Zk3619/Jadix"
"rust-version" = "1.86"
"version" = "0.31.0-beta.3-jadix.1"
"exclude" = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

readme = "README.md"
["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"all-features" = true

["features"]
"event-handler" = []
"positioner" = ["dep:dpi"]
"wayland" = ["dep:memmap2"]
"x11" = ["xkbcommon-dl?/x11", "dep:x11-dl"]
"xkb" = ["dep:xkbcommon-dl", "dep:smol_str"]
"core-foundation" = ["dep:block2", "dep:objc2", "dep:objc2-core-foundation"]
"foundation" = ["dep:block2", "dep:objc2", "dep:objc2-foundation"]

["dependencies"]

["dependencies"."dpi"]
"optional" = true
"version" = "=0.1.2"

["dependencies"."smol_str"]
"version" = "0.3"
"optional" = true

["dependencies"."tracing"]
"version" = "0.1.40"
"default-features" = false

["dependencies"."winit-core"]
"package" = "jadix_winit_core"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-core"

["dependencies"."memmap2"]
"version" = "0.9.0"
"optional" = true

["dependencies"."x11-dl"]
"version" = "2.19.1"
"optional" = true

["dependencies"."xkbcommon-dl"]
"version" = "0.4.2"
"optional" = true

["dependencies"."block2"]
"version" = "0.6.1"
"optional" = true

["dependencies"."objc2"]
"version" = "0.6.1"
"features" = ["relax-sign-encoding"]
"optional" = true

["dependencies"."objc2-core-foundation"]
"version" = "0.3.2"
"default-features" = false
"optional" = true
"features" = ["std", "block2", "objc2", "CFRunLoop", "CFString"]

["dependencies"."objc2-foundation"]
"version" = "0.3.2"
"default-features" = false
"optional" = true
"features" = ["std", "block2", "NSNotification", "NSString", "NSOperation"]

[lib]
name = "winit_common"
