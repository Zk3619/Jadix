
["package"]
"description" = "Winit's Android backend"
documentation = "https://docs.rs/jadix_winit_android"
"edition" = "2024"
"license" = "Apache-2.0"
"name" = "jadix_winit_android"
repository = "https://github.com/Zk3619/Jadix"
"rust-version" = "1.86"
"version" = "0.31.0-beta.3-jadix.1"
"exclude" = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

readme = "README.md"
["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"features" = ["serde", "native-activity"]
"targets" = ["aarch64-linux-android"]

["features"]
"game-activity" = ["android-activity/game-activity"]
"native-activity" = ["android-activity/native-activity"]
"serde" = ["dep:serde", "bitflags/serde", "smol_str/serde", "dpi/serde", "winit-core/serde"]

["dependencies"]

["dependencies"."bitflags"]
"version" = "2"

["dependencies"."dpi"]
"version" = "=0.1.2"

["dependencies"."rwh_06"]
"package" = "raw-window-handle"
"version" = "0.6"
"features" = ["std"]

["dependencies"."serde"]
"version" = "1"
"features" = ["serde_derive"]
"optional" = true

["dependencies"."smol_str"]
"version" = "0.3"

["dependencies"."tracing"]
"version" = "0.1.40"
"default-features" = false

["dependencies"."winit-core"]
"package" = "jadix_winit_core"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-core"

["target"]

["target"."cfg(target_os = \"android\")"]

["target"."cfg(target_os = \"android\")"."dependencies"]

["target"."cfg(target_os = \"android\")"."dependencies"."android-activity"]
"version" = "0.6.0"

["target"."cfg(target_os = \"android\")"."dependencies"."ndk"]
"version" = "0.9.0"
"features" = ["rwh_06"]
"default-features" = false

["dev-dependencies"]

["dev-dependencies"."winit"]
"package" = "jadix_winit"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../../crates/jadix_winit"

[lib]
name = "winit_android"
