
["package"]
"edition" = "2021"
"rust-version" = "1.76"
"name" = "jadix_wgpu_core_deps_windows_linux_android"
"version" = "30.0.0"
"authors" = ["gfx-rs developers"]
"build" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "Feature unification helper crate for the Windows/Linux/Android platforms"
"homepage" = "https://wgpu.rs/"
readme = "README.md"
"keywords" = ["graphics"]
"license" = "MIT OR Apache-2.0"
repository = "https://github.com/Zk3619/Jadix"
"exclude" = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

["features"]
"drm" = ["wgpu-hal/drm"]
"dx12" = ["wgpu-hal/dx12"]
"gles" = ["wgpu-hal/gles"]
"renderdoc" = ["wgpu-hal/renderdoc"]
"vulkan" = ["wgpu-hal/vulkan"]

["lib"]
"name" = "wgpu_core_deps_windows_linux_android"
"path" = "src/lib.rs"

["target"]

["target"."cfg(any(windows, target_os = \"linux\", target_os = \"android\", target_os = \"freebsd\", target_os = \"netbsd\"))"]

["target"."cfg(any(windows, target_os = \"linux\", target_os = \"android\", target_os = \"freebsd\", target_os = \"netbsd\"))"."dependencies"]

["target"."cfg(any(windows, target_os = \"linux\", target_os = \"android\", target_os = \"freebsd\", target_os = \"netbsd\"))"."dependencies"."wgpu-hal"]
"package" = "jadix_wgpu_hal"
"version" = "=30.0.0"
"path" = "../wgpu-hal"

["lints"]

["lints"."clippy"]
"ref_as_ptr" = "warn"

["lints"."rust"]
"missing_debug_implementations" = "warn"
