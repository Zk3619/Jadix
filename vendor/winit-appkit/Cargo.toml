
["package"]
"description" = "Winit's Appkit / macOS backend"
documentation = "https://docs.rs/jadix_winit_appkit"
"edition" = "2024"
"license" = "Apache-2.0"
"name" = "jadix_winit_appkit"
repository = "https://github.com/Zk3619/Jadix"
"rust-version" = "1.86"
"version" = "0.31.0-beta.3-jadix.1"
"exclude" = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

readme = "README.md"
["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"features" = ["serde"]
"targets" = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

["features"]
"private-apple-apis" = []
"serde" = ["dep:serde", "bitflags/serde", "smol_str/serde", "dpi/serde"]

["dependencies"]

["dependencies"."bitflags"]
"version" = "2"

["dependencies"."dpi"]
"version" = "=0.1.2"

["dependencies"."rwh_06"]
"package" = "raw-window-handle"
"version" = "0.6"
"features" = ["std"]

["dependencies"."serde"]
"version" = "1"
"features" = ["serde_derive"]
"optional" = true

["dependencies"."smol_str"]
"version" = "0.3"

["dependencies"."tracing"]
"version" = "0.1.40"
"default-features" = false

["dependencies"."winit-core"]
"package" = "jadix_winit_core"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-core"

["target"]

["target"."cfg(target_vendor = \"apple\")"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"."block2"]
"version" = "0.6.1"

["target"."cfg(target_vendor = \"apple\")"."dependencies"."dispatch2"]
"version" = "0.3.0"
"default-features" = false
"features" = ["std", "objc2"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"."objc2"]
"version" = "0.6.1"
"features" = ["relax-sign-encoding"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"."objc2-app-kit"]
"version" = "0.3.2"
"default-features" = false
"features" = ["std", "objc2-core-foundation", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSButton", "NSColor", "NSControl", "NSCursor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSOpenGLView", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSTextInputClient", "NSTextInputContext", "NSTrackingArea", "NSToolbar", "NSView", "NSVisualEffectView", "NSWindow", "NSWindowScripting", "NSWindowTabGroup"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"."objc2-core-foundation"]
"version" = "0.3.2"
"default-features" = false
"features" = ["std", "block2", "CFBase", "CFCGTypes", "CFData", "CFRunLoop", "CFString", "CFUUID"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"."objc2-core-graphics"]
"version" = "0.3.2"
"default-features" = false
"features" = ["std", "libc", "CGDirectDisplay", "CGDisplayConfiguration", "CGDisplayFade", "CGError", "CGRemoteOperation", "CGWindowLevel"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"."objc2-core-video"]
"version" = "0.3.2"
"default-features" = false
"features" = ["std", "objc2-core-graphics", "CVBase", "CVReturn", "CVDisplayLink"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"."objc2-foundation"]
"version" = "0.3.2"
"default-features" = false
"features" = ["std", "block2", "objc2-core-foundation", "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSEnumerator", "NSGeometry", "NSKeyValueObserving", "NSNotification", "NSObjCRuntime", "NSOperation", "NSPathUtilities", "NSProcessInfo", "NSRunLoop", "NSString", "NSThread", "NSValue"]

["target"."cfg(target_vendor = \"apple\")"."dependencies"."winit-common"]
"package" = "jadix_winit_common"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-common"
"features" = ["core-foundation", "event-handler", "foundation", "positioner"]

["dev-dependencies"]

["dev-dependencies"."winit"]
"package" = "jadix_winit"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../../crates/jadix_winit"

[lib]
name = "winit_appkit"
