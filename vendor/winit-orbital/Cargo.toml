
["package"]
"description" = "Winit's Orbital/Redox backend"
documentation = "https://docs.rs/jadix_winit_orbital"
"edition" = "2024"
"license" = "Apache-2.0"
"name" = "jadix_winit_orbital"
repository = "https://github.com/Zk3619/Jadix"
"rust-version" = "1.86"
"version" = "0.31.0-beta.3-jadix.1"
"exclude" = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

readme = "README.md"
["features"]
"serde" = ["dep:serde", "bitflags/serde", "smol_str/serde", "dpi/serde"]

["dependencies"]

["dependencies"."bitflags"]
"version" = "2"

["dependencies"."dpi"]
"version" = "=0.1.2"

["dependencies"."rwh_06"]
"package" = "raw-window-handle"
"version" = "0.6"
"features" = ["std"]

["dependencies"."serde"]
"version" = "1"
"features" = ["serde_derive"]
"optional" = true

["dependencies"."smol_str"]
"version" = "0.3"

["dependencies"."tracing"]
"version" = "0.1.40"
"default-features" = false

["dependencies"."winit-core"]
"package" = "jadix_winit_core"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-core"

["dependencies"."libredox"]
"version" = "0.1.12"

["dependencies"."orbclient"]
"version" = "0.4.3"
"default-features" = false

["dependencies"."redox_event"]
"package" = "redox_event"
"version" = "0.4.8"

[lib]
name = "winit_orbital"
