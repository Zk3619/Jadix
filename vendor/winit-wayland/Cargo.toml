[package]
description = "Winit's Wayland backend"
documentation = "https://docs.rs/winit-wayland"
edition = "2024"
license = "Apache-2.0"
name = "winit-wayland"
repository = "https://github.com/Zk3619/Jadix"
rust-version = "1.88"
version = "0.31.0-beta.3"
publish = false

[features]
default = ["dlopen", "csd-adwaita"]

csd-adwaita = ["sctk-adwaita", "sctk-adwaita/ab_glyph"]
csd-adwaita-cosmic-text = ["sctk-adwaita", "sctk-adwaita/cosmic-text"]
csd-adwaita-crossfont = ["sctk-adwaita", "sctk-adwaita/crossfont"]
csd-adwaita-notitle = ["sctk-adwaita"]
csd-adwaita-notitlebar = ["csd-adwaita-notitle"]
csd-adwaita-skrifa = ["sctk-adwaita", "sctk-adwaita/skrifa"]
dlopen = ["wayland-backend/dlopen"]
serde = ["dep:serde", "bitflags/serde", "smol_str/serde", "dpi/serde"]

[dependencies]
bitflags = "2"
cursor-icon = "1.1"
dpi = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }
percent-encoding = "2"
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"] }
serde = { version = "1", features = ["serde_derive"], optional = true }
smol_str = "0.3"
tracing = { version = "0.1.40", default-features = false }
winit-core = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }

# Platform-specific
calloop = "0.14.3"
foldhash = { version = "0.2", default-features = false, features = ["std"] }
libc = "0.2.64"
memmap2 = "0.9"
rustix = { version = "1.0.7", default-features = false, features = ["std", "system", "thread", "process", "event", "pipe"] }
sctk = { package = "smithay-client-toolkit", version = "0.21.0", default-features = false, features = [
    "calloop",
] }
sctk-adwaita = { version = "0.12.0", default-features = false, optional = true }
wayland-backend = { version = "0.3.10", default-features = false, features = ["client_system"] }
wayland-client = "0.31.10"
wayland-protocols = { version = "0.32.12", features = ["staging", "unstable"] }
wayland-protocols-plasma = { version = "0.3.8", features = ["client"] }
winit-common = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83", features = ["xkb", "wayland"] }

[package.metadata.docs.rs]
features = ["dlopen", "serde", "csd-adwaita"]
