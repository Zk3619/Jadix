
["package"]
"description" = "Winit's Wayland backend"
documentation = "https://docs.rs/jadix_winit_wayland"
"edition" = "2024"
"license" = "Apache-2.0"
"name" = "jadix_winit_wayland"
repository = "https://github.com/Zk3619/Jadix"
"rust-version" = "1.88"
"version" = "0.31.0-beta.3-jadix.1"
"exclude" = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

readme = "README.md"
["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"features" = ["dlopen", "serde", "csd-adwaita"]

["features"]
"default" = ["dlopen", "csd-adwaita"]
"csd-adwaita" = ["sctk-adwaita", "sctk-adwaita/ab_glyph"]
"csd-adwaita-cosmic-text" = ["sctk-adwaita", "sctk-adwaita/cosmic-text"]
"csd-adwaita-crossfont" = ["sctk-adwaita", "sctk-adwaita/crossfont"]
"csd-adwaita-notitle" = ["sctk-adwaita"]
"csd-adwaita-notitlebar" = ["csd-adwaita-notitle"]
"csd-adwaita-skrifa" = ["sctk-adwaita", "sctk-adwaita/skrifa"]
"dlopen" = ["wayland-backend/dlopen"]
"serde" = ["dep:serde", "bitflags/serde", "smol_str/serde", "dpi/serde"]

["dependencies"]
"bitflags" = "2"
"cursor-icon" = "1.1"
"percent-encoding" = "2"
"smol_str" = "0.3"
"calloop" = "0.14.3"
"libc" = "0.2.64"
"memmap2" = "0.9"
"wayland-client" = "0.31.10"

["dependencies"."dpi"]
"version" = "=0.1.2"

["dependencies"."rwh_06"]
"package" = "raw-window-handle"
"version" = "0.6"
"features" = ["std"]

["dependencies"."serde"]
"version" = "1"
"features" = ["serde_derive"]
"optional" = true

["dependencies"."tracing"]
"version" = "0.1.40"
"default-features" = false

["dependencies"."winit-core"]
"package" = "jadix_winit_core"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-core"

["dependencies"."foldhash"]
"version" = "0.2"
"default-features" = false
"features" = ["std"]

["dependencies"."rustix"]
"version" = "1.0.7"
"default-features" = false
"features" = ["std", "system", "thread", "process", "event", "pipe"]

["dependencies"."sctk"]
"package" = "smithay-client-toolkit"
"version" = "0.21.0"
"default-features" = false
"features" = ["calloop"]

["dependencies"."sctk-adwaita"]
"version" = "0.12.0"
"default-features" = false
"optional" = true

["dependencies"."wayland-backend"]
"version" = "0.3.10"
"default-features" = false
"features" = ["client_system"]

["dependencies"."wayland-protocols"]
"version" = "0.32.12"
"features" = ["staging", "unstable"]

["dependencies"."wayland-protocols-plasma"]
"version" = "0.3.8"
"features" = ["client"]

["dependencies"."winit-common"]
"package" = "jadix_winit_common"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../winit-common"
"features" = ["xkb", "wayland"]

[lib]
name = "winit_wayland"
