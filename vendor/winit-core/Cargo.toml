
["package"]
"authors" = ["The winit contributors", "Kirill Chibisov <contact@kchibisov.com>"]
"categories" = ["gui"]
"description" = "winit core API."
documentation = "https://docs.rs/jadix_winit_core"
"edition" = "2024"
"keywords" = ["windowing"]
"license" = "Apache-2.0"
"name" = "jadix_winit_core"
readme = "README.md"
repository = "https://github.com/Zk3619/Jadix"
"rust-version" = "1.86"
"version" = "0.31.0-beta.3-jadix.1"
"exclude" = ["Cargo.toml.orig", ".cargo_vcs_info.json"]

["features"]
"serde" = ["dep:serde", "bitflags/serde", "cursor-icon/serde", "dpi/serde", "keyboard-types/serde", "smol_str/serde"]

["dependencies"]

["dependencies"."bitflags"]
"version" = "2"

["dependencies"."cursor-icon"]
"version" = "1.1.0"

["dependencies"."dpi"]
"version" = "=0.1.2"

["dependencies"."keyboard-types"]
"version" = "0.8.0"

["dependencies"."rwh_06"]
"package" = "raw-window-handle"
"version" = "0.6"
"features" = ["std"]

["dependencies"."serde"]
"version" = "1"
"features" = ["serde_derive"]
"optional" = true

["dependencies"."smol_str"]
"version" = "0.3"

["target"]

["target"."cfg(all(target_family = \"wasm\", any(target_os = \"unknown\", target_os = \"none\")))"]

["target"."cfg(all(target_family = \"wasm\", any(target_os = \"unknown\", target_os = \"none\")))"."dependencies"]

["target"."cfg(all(target_family = \"wasm\", any(target_os = \"unknown\", target_os = \"none\")))"."dependencies"."web-time"]
"version" = "1"

["dev-dependencies"]

["dev-dependencies"."winit"]
"package" = "jadix_winit"
"version" = "=0.31.0-beta.3-jadix.1"
"path" = "../../crates/jadix_winit"

[lib]
name = "winit_core"
