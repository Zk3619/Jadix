[package]
name = "jadix_renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU compute kernels, backdrop blur pipelines and emoji classification"
readme = "README.md"

[features]
default = []
compute = []
backend-dx12 = ["wgpu/dx12", "compute"]
backend-dx11-angle = ["wgpu/gles"]
backend-dx11-native = ["wgpu/dx11"]
test-hooks = []

[dependencies]
web-time.workspace = true
unicode-segmentation.workspace = true
wgpu.workspace = true
bytemuck = { workspace = true, default-features = true }
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
