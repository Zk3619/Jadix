[package]
name = "jadix_document"
version.workspace = true
edition.workspace = true
description = "GUI-independent text snapshots, document height indexing and optional diffs"
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
checkpoint = ["dep:serde", "dep:serde_json", "dep:sha2"]
markdown = ["dep:pulldown-cmark", "dep:serde", "dep:serde_json"]
document-editing = ["markdown", "dep:html5ever"]
document-math = ["markdown", "dep:latex-rust"]
science = ["dep:serde"]
diff = ["dep:similar", "dep:unicode-segmentation"]
syntax = ["dep:syntect"]

[dependencies]
html5ever = { version = "0.39", optional = true }
sha2 = { version = "=0.10.9", optional = true }
pulldown-cmark = { workspace = true, optional = true, features = ["html"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
latex-rust = { workspace = true, optional = true }
syntect = { version = "5.3", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
similar = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
