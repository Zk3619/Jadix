[package]
name = "jadix_lucide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lucide static icons, animated playback and recipes for Jadix"
readme = "README.md"

[lib]
test = false

[features]
default = ["ui", "paths"]
paths = []
font = []
ui = ["dep:jadix", "font"]
macros = ["ui", "jadix/macros"]
animated = ["lucide-animated"]
lucide-animated = ["ui", "jadix/animation-base"]
svg = ["ui", "jadix/svg", "paths"]
animation-path = ["svg", "jadix/animation-path"]
bundled-lucide = ["paths", "font"]

[dependencies]
web-time.workspace = true
serde.workspace = true
serde_json.workspace = true
jadix = { workspace = true, optional = true }

[[test]]
name = "playback"
required-features = ["animated"]

[[test]]
name = "morph"
required-features = ["animation-path"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("product-tests", "gallery-tests"))'] }
