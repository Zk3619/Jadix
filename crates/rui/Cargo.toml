[package]
name = "rui"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust native UI framework (SolidJS-style reactivity + Tailwind/UnoCSS + ShadCN components)"
license = "MIT"
repository = "https://github.com/Zk3619/rui"
readme = "../../README.md"
keywords = ["gui", "ui", "wgpu", "reactive", "desktop"]
categories = ["gui"]

[features]
# Lean by default: no resvg. Apps opt into emoji-svg / bundled-* as needed.
default = []
# Optional runtime logger initialization (env_logger).
runtime-logging = ["dep:env_logger"]
# Optional structured spans on hot paths (layout / reconcile). Off by default.
tracing = ["dep:tracing"]
# Native system tray via tray-icon + muda. Off by default (see docs/tray.md).
system-tray = ["dep:tray-icon"]
# Add the D3D12 backend (~520 KiB: wgpu-hal dx12 + DXC + gpu-allocator). Off by default:
# the GL backend renders the same UI and its driver commits ~80 MB less on Windows.
# Enable when you need WARP software fallback or D3D12-specific behaviour.
backend-dx12 = ["wgpu/dx12"]
# Optional Vulkan backend (kept off by default to avoid multi-backend bloat on Windows).
backend-vulkan = ["wgpu/vulkan"]
# Embed lucide.ttf (~0.8MB). Prefer shipping assets/ beside the exe instead.
bundled-lucide = []
# Embed large fonts into the binary (single-file distro; dramatically increases size).
bundled-cjk = []
bundled-cjk-serif = []
bundled-emoji = []
bundled-symbols = []
bundled-fonts = ["bundled-lucide", "bundled-cjk", "bundled-cjk-serif", "bundled-emoji", "bundled-symbols"]
# Load optional fonts from disk at runtime (RUI_FONT_DIR / assets/), without embedding.
fonts-cjk = []
fonts-cjk-serif = []
fonts-emoji = []
# SVG raster for Image / CSS cursor (resvg). Not in default.
svg = ["dep:resvg"]
# Twemoji SVG via the same resvg (PNG fallback remains without it).
emoji-svg = ["svg"]
# Extra rasters for Image, CSS cursor, and queue_image_* (PNG/ICO/BMP always on).
jpeg = ["dep:jpeg-decoder"]
gif = ["dep:gif"]
webp = ["dep:image-webp"]
images = ["jpeg", "gif", "webp"]
cursor-images = ["images"]
# WP-3.13 experimental <scene3d> rotating cube. Off by default (volume / ADR-3).
scene3d = []
# B1 runtime Inspector: Elements pick/highlight + Reactivity graph + style live edit.
# Opt-in; not in default release surface (see docs/devtools.md).
devtools = []

[dependencies]
winit = { workspace = true }
wgpu = { workspace = true }
taffy = { workspace = true }
palette = { workspace = true }
bytemuck = { workspace = true }
glyphon = { workspace = true }
pollster = { workspace = true }
env_logger = { workspace = true, optional = true }
log = { workspace = true }
tracing = { workspace = true, optional = true }
rui_macros = { path = "../rui_macros" }
rui_style_tokens = { path = "../rui_style_tokens" }
clipboard-rs = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
swash = { workspace = true }
fontdb = { workspace = true }
ttf-parser = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-linebreak = { workspace = true }
png = "0.18.1"
jpeg-decoder = { version = "0.3", optional = true, default-features = false }
gif = { version = "0.13", optional = true, default-features = false }
image-webp = { version = "0.2", optional = true }
resvg = { version = "0.45.1", optional = true }
# default-features off: skip Linux libxdo. gtk still required on Linux if this feature is on.
tray-icon = { version = "0.21", optional = true, default-features = false }

[dev-dependencies]
jpeg-encoder = "0.6"

[[bench]]
name = "layout_baseline"
harness = false
