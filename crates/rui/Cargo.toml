[package]
name = "rui"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust native UI framework (SolidJS-style reactivity + Tailwind/UnoCSS + ShadCN components)"
license = "MIT"
repository = "https://github.com/Zk3619/rui"
readme = "../../README.md"
keywords = ["gui", "ui", "wgpu", "reactive", "desktop"]
categories = ["gui"]

[features]
# Lean by default: no resvg / serde. Opt into boundaries below.
default = []
# Dev-time TCP hot reload (`rui_hot_reload_cli`). Requires debug build.
hot-reload = []
# pqoqubbw animated Lucide recipes — runtime JSON from assets/lucide_animated.json.
lucide-animated = []
# Optional runtime logger: console (stderr) + optional file via RUI_LOG_FILE (env_logger).
runtime-logging = ["dep:env_logger"]
# Optional structured spans on hot paths (layout / reconcile). Off by default.
tracing = ["dep:tracing"]
# Native system tray via tray-icon + muda. Off by default (see docs/ops/tray.md).
system-tray = ["dep:tray-icon"]
# Add the D3D12 backend (~520 KiB: wgpu-hal dx12 + DXC + gpu-allocator). Off by default:
# the GL backend renders the same UI and its driver commits ~80 MB less on Windows.
# Enable when you need WARP software fallback or D3D12-specific behaviour.
backend-dx12 = ["wgpu/dx12"]
# Optional Vulkan backend (kept off by default to avoid multi-backend bloat on Windows).
backend-vulkan = ["wgpu/vulkan"]
# Embed lucide.ttf (~0.8MB). Prefer shipping assets/ beside the exe instead.
bundled-lucide = []
# Embed large fonts into the binary (single-file distro; dramatically increases size).
bundled-cjk = []
bundled-cjk-serif = []
bundled-emoji = []
bundled-symbols = []
bundled-fonts = ["bundled-lucide", "bundled-cjk", "bundled-cjk-serif", "bundled-emoji", "bundled-symbols"]
# Load optional fonts from disk at runtime (RUI_FONT_DIR / assets/), without embedding.
fonts-cjk = []
fonts-cjk-serif = []
fonts-emoji = []
# SVG raster for Image / CSS cursor (resvg). Not in default.
svg = ["dep:resvg"]
# Twemoji SVG via the same resvg (PNG fallback remains without it).
emoji-svg = ["svg"]
# Extra raster codecs (off by default; see `image` dep for the core set).
image-bmp = ["image/bmp"]
image-tiff = ["image/tiff"]
image-avif = ["image/avif"]
image-exr = ["image/exr"]
image-hdr = ["image/hdr"]
image-pnm = ["image/pnm"]
image-qoi = ["image/qoi"]
image-tga = ["image/tga"]
image-ff = ["image/ff"]
image-full = [
    "image-bmp",
    "image-tiff",
    "image-avif",
    "image-exr",
    "image-hdr",
    "image-pnm",
    "image-qoi",
    "image-tga",
    "image-ff",
]
# Deprecated aliases (raster decode is always on via the `image` crate).
jpeg = ["image/jpeg"]
gif = ["image/gif"]
webp = ["image/webp"]
images = []
cursor-images = []
# WP-3.13 experimental <scene3d> rotating cube. Off by default (volume / ADR-3).
scene3d = []
# WP-M.3: YUV (NV12 / I420 / P010) → BT.709 RGBA for ImageStream. Off by default.
# Zero decoder crates — applications inject demux.
image-stream = []
# B1 runtime Inspector: Elements pick/highlight + Reactivity graph + style live edit.
# Opt-in; not in default release surface (see docs/ops/devtools.md).
devtools = []
# Allow `<Image src="https://…">` / Avatar / Icon to call an app-installed
# [`RemoteAssetFetcher`] (no HTTP crate). See docs/ops/remote_asset.md.
remote-asset = []
# Input/Textarea undo+redo history. Off by default (lean crate). Gallery enables it.
# See docs/plans/text_undo_redo.md. Workspace feature unification: do not enable
# from calculator / gpu_probe; package-specific `cargo test -p rui --lib` stays off.
text-undo = []
# P3 measured String vs ropey (ignored test `text_buffer_mid_insert` + text_undo_redo.md §9.3).
# Not enabled: L1/L2 stay on StringBuffer. Do not uncomment without new L3 numbers.
# text-undo-rope = ["text-undo", "dep:ropey"]

[dependencies]
winit = { workspace = true }
wgpu = { workspace = true }
taffy = { workspace = true }
bytemuck = { workspace = true }
glyphon = { workspace = true }
env_logger = { workspace = true, optional = true }
log = { workspace = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rui_macros = { path = "../rui_macros" }
rui_style_tokens = { path = "../rui_style_tokens" }
# Scoped grow around `app_builder` / `ui!` (Windows PE ~1 MiB). Not a PE `/STACK` bump.
stacker = "0.1"
clipboard-rs = { workspace = true }
rfd = { workspace = true }
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
swash = { workspace = true }
ttf-parser = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-linebreak = { workspace = true }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "ico",
] }
resvg = { version = "0.45.1", optional = true }
# default-features off: skip Linux libxdo. gtk still required on Linux if this feature is on.
tray-icon = { version = "0.21", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Used by ignored `text_buffer_mid_insert` (P3 String vs ropey). Not a product dependency.
ropey = "1.6"

[[bench]]
name = "layout_baseline"
harness = false
