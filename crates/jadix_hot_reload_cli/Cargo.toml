[package]
name = "jadix_hot_reload_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Development watcher and template patch sender for Jadix"
readme = "README.md"

[[bin]]
name = "jadix-hot-reload"
path = "src/main.rs"

[dependencies]
jadix_hot_reload = { workspace = true, features = ["syntax"] }
jadix_lucide.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
