[package]
name = "jadix_window_state"
version.workspace = true
edition.workspace = true
description = "Cross-platform window state persistence (TOML) for jadix / winit apps"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gui", "window", "winit", "jadix"]
categories = ["gui"]

include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**/*", "/README.zh.md", "/GUIDE.md"]

[features]
# Persistence + `WindowView` are always available. `winit` applies to live windows.
# `jadix` registers a lifecycle hook so restore/save run inside the engine event loop.
default = ["winit"]
winit = ["dep:winit"]
jadix = ["winit", "dep:jadix"]

[dependencies]
log = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
winit = { "package" = "jadix_winit", "version" = "=0.31.0-beta.3-jadix.1", "path" = "../jadix_winit", "optional" = true }
# Optional core engine integration.
jadix = { workspace = true, optional = true }
