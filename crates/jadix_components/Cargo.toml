[package]
name = "jadix_components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Jadix native UI components with optional RSX authoring"
readme = "README.md"

[lib]
test = false

[features]
default = ["gpu"]
gpu = ["jadix/gpu", "jadix/drag", "dep:winit", "jadix_lucide/ui", "jadix_lucide/svg"]
markdown = ["gpu", "jadix/markdown"]
svg = ["gpu", "jadix/svg"]
macros = ["jadix/macros"]
dnd = ["gpu", "dep:jadix_dnd"]
code = ["gpu", "jadix/code"]
code-lsp = ["gpu", "jadix/code-lsp"]
document = ["gpu", "jadix/document", "dep:image", "dep:glyphon"]
document-editing = ["gpu", "jadix/document-editing", "document"]
document-diff = ["gpu", "jadix/document-diff"]
document-science = ["gpu", "jadix/document-science", "document"]
document-math = ["gpu", "jadix/document-math", "document", "svg"]
syntax-highlighting = ["gpu", "jadix/syntax-highlighting"]
scale-preview = ["gpu", "jadix/scale-preview"]
webview = ["gpu", "jadix/webview"]
i18n = ["gpu", "jadix/i18n"]
a11y = ["gpu", "jadix/a11y"]
file-dialog = ["gpu", "jadix/file-dialog"]
file-persistence = ["gpu", "jadix/file-persistence"]
animation-base = ["gpu", "jadix/animation-base"]
animation-ex = ["gpu", "jadix/animation-ex", "animation-base"]
animation-path = ["gpu", "jadix/animation-path", "animation-ex"]
animation = ["gpu", "jadix/animation", "animation-base", "animation-ex"]
image-stream = ["gpu", "jadix/image-stream"]
image-gif = ["gpu", "jadix/image-gif"]
image-webp = ["gpu", "jadix/image-webp"]
remote-asset = ["gpu", "jadix/remote-asset"]
text-undo = ["gpu", "jadix/text-undo"]
themes = ["jadix/themes", "theme-shadcn", "theme-fluent", "theme-material3", "theme-liquid-glass"]
theme-shadcn = ["jadix/theme-shadcn"]
theme-fluent = ["jadix/theme-fluent"]
theme-material3 = ["jadix/theme-material3"]
theme-liquid-glass = ["jadix/theme-liquid-glass"]

[dependencies]
web-time.workspace = true
jadix = { path = "../jadix", version = "0.1.0", default-features = false }
jadix_dnd = { workspace = true, optional = true }
taffy.workspace = true
winit = { workspace = true, optional = true }
log.workspace = true
serde.workspace = true
serde_json.workspace = true

unicode-segmentation.workspace = true
image = { workspace = true, optional = true }
glyphon = { workspace = true, "optional" = true }


[[test]]
name = "app_shell"
required-features = ["gpu", "macros"]

[[test]]
name = "authoring_contracts"
required-features = ["gpu", "macros"]

[[test]]
name = "authoring_runtime_contracts"
required-features = ["gpu", "macros"]

[[test]]
name = "fragment_macro"
required-features = ["gpu", "macros"]

[[test]]
name = "geometry_contracts"
required-features = ["gpu", "macros"]

[[test]]
name = "img_alias"
required-features = ["gpu", "macros"]

[[test]]
name = "input_adornment_rsx"
required-features = ["gpu", "macros"]

[[test]]
name = "macro_lowering"
required-features = ["gpu", "macros"]

[[test]]
name = "media_customization"
required-features = ["gpu", "macros"]

[[test]]
name = "media_player"
required-features = ["gpu", "macros"]

[[test]]
name = "media_presentation_layout"
required-features = ["gpu", "macros"]

[[test]]
name = "prelude_dual_surface"
required-features = ["gpu", "macros"]

[[test]]
name = "rsx_class"
required-features = ["gpu", "macros"]

[[test]]
name = "scroll_components"
required-features = ["gpu", "macros"]

[[test]]
name = "text_document_views"
required-features = ["gpu", "macros"]

[[test]]
name = "textarea_rsx_wrap"
required-features = ["gpu", "macros"]

[[test]]
name = "document_editing"
required-features = ["gpu", "macros"]

[[test]]
name = "document_extensions"
required-features = ["gpu", "macros"]

[[test]]
name = "scale_preview"
required-features = ["gpu", "macros"]

[[test]]
name = "feature_contracts"
required-features = ["gpu", "macros"]

[[test]]
name = "input_fidelity"
required-features = ["gpu"]

[[test]]
name = "native_projection"
required-features = ["gpu"]

[[test]]
name = "portable_source"
required-features = ["gpu", "macros"]

[[example]]
name = "document_editor"
required-features = ["gpu", "macros", "document-editing"]

[[example]]
name = "text_documents"
required-features = ["gpu", "macros", "document-diff"]

[[example]]
name = "application_icons"
required-features = ["gpu", "macros"]

[[example]]
name = "desktop_shell"
required-features = ["gpu", "macros"]

[dev-dependencies]
jadix_native.workspace = true
jadix_shell.workspace = true
jadix_lucide.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("product-tests"))'] }
