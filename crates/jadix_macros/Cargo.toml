[package]
name = "jadix_macros"
version.workspace = true
# Proc-macro crate stays on 2024; workspace default is 2021.
edition = "2024"
description = "Proc-macros for the jadix UI framework (`ui!`, `#[component]`)"
license.workspace = true
repository.workspace = true

include = ["/Cargo.toml", "/LICENSE", "/src/**/*", "/README.md", "/README.zh.md"]

readme = "README.md"
[lib]
proc-macro = true

[dependencies]
jadix_hot_reload = { workspace = true, features = ["syntax"] }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
serde_json = { workspace = true }
jadix_style_tokens = { workspace = true }
