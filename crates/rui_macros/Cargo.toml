[package]
name = "rui_macros"
version.workspace = true
# Proc-macro crate stays on 2024; workspace default is 2021.
edition = "2024"
description = "Proc-macros for the rui UI framework (`ui!`, `#[component]`)"
license.workspace = true
repository.workspace = true

include = [
  "/Cargo.toml",
  "/LICENSE",
  "/src/**/*",
]

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
serde_json = { workspace = true }
rui_style_tokens = { workspace = true }
