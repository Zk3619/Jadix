[package]
name = "rui_macros"
version = "0.1.0"
edition = "2024"
description = "Proc-macros for the rui UI framework (`ui!`, `#[component]`)"
license = "MIT"
repository = "https://github.com/Zk3619/rui"
build = "build.rs"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
phf = { version = "0.11", default-features = false }
rui_style_tokens = { path = "../rui_style_tokens" }

[build-dependencies]
serde_json = { workspace = true }
phf_codegen = "0.11"
