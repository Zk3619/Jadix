"example" = [{ "name" = "basic", "path" = "examples/basic.rs", "doc-scrape-examples" = true }, { "name" = "custom_tree_owned_partial", "path" = "examples/custom_tree_owned_partial.rs" }, { "name" = "custom_tree_owned_unsafe", "path" = "examples/custom_tree_owned_unsafe.rs" }, { "name" = "custom_tree_vec", "path" = "examples/custom_tree_vec.rs" }, { "name" = "flexbox_gap", "path" = "examples/flexbox_gap.rs" }, { "name" = "grid_holy_grail", "path" = "examples/grid_holy_grail.rs" }, { "name" = "measure", "path" = "examples/measure.rs" }, { "name" = "nested", "path" = "examples/nested.rs" }]

["package"]
"edition" = "2021"
"rust-version" = "1.71"
"name" = "jadix_taffy"
"version" = "0.1.0"
"authors" = ["Alice Cecile <alice.i.cecile@gmail.com>", "Johnathan Kelley <jkelleyrtp@gmail.com>", "Nico Burns <nico@nicoburns.com>"]
"build" = false
include = ["src/**/*", "examples/**/*", "Cargo.toml", "README.md", "LICENSE", "JADIX_FORK.md", "JADIX_PATCH.md", "/README.zh.md", "/GUIDE.md"]
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "A flexible UI layout library "
readme = "README.md"
"keywords" = ["cross-platform", "layout", "flexbox", "css-grid", "grid"]
"categories" = ["gui"]
"license" = "MIT"
repository = "https://github.com/Zk3619/Jadix"

["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"all-features" = true
"cargo-args" = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
"rustdoc-args" = ["--cfg", "docsrs"]

["features"]
"alloc" = []
"block_layout" = []
"calc" = []
"content_size" = []
"debug" = ["std"]
"default" = ["std", "taffy_tree", "flexbox", "flexbox_balance", "grid", "block_layout", "float_layout", "calc", "content_size", "detailed_layout_info"]
"detailed_layout_info" = []
"flexbox" = []
"flexbox_balance" = ["flexbox"]
"float_layout" = []
"grid" = ["dep:smallvec"]
"parse" = ["dep:cssparser"]
"parse_faster" = ["parse", "cssparser/fast_match_byte"]
"profile" = ["std"]
"serde" = ["dep:serde", "serde/alloc"]
"std" = ["serde?/std", "slotmap?/std"]
"strict_provenance" = []
"taffy_tree" = ["dep:slotmap"]

["lib"]
"name" = "taffy"
"path" = "src/lib.rs"

["dependencies"]

["dependencies"."cssparser"]
"version" = "0.37.0"
"optional" = true
"default-features" = false

["dependencies"."document-features"]
"version" = "0.2.7"
"optional" = true

["dependencies"."serde"]
"version" = "1.0"
"features" = ["serde_derive"]
"optional" = true
"default-features" = false

["dependencies"."slotmap"]
"version" = "1.0.6"
"optional" = true
"default-features" = false

["dependencies"."smallvec"]
"version" = "1.13"
"optional" = true
"default-features" = false

["dev-dependencies"]

["dev-dependencies"."roxmltree"]
"version" = "0.21.1"

["dev-dependencies"."serde_json"]
"version" = "1.0.93"
