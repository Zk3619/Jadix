[package]
name = "jadix_hot_reload"
version = "0.1.1"
edition.workspace = true
description = "Framework-neutral hot-reload protocol and receiver"
license.workspace = true
repository.workspace = true

include = ["/Cargo.toml", "/LICENSE", "/src/**/*", "/tests/**/*", "/README.md", "/README.zh.md", "/GUIDE.md", "/assets/**/*"]

readme = "README.md"
[features]
default = []
syntax = ["dep:proc-macro2", "dep:syn"]

cli = ["syntax", "dep:notify", "dep:toml"]

[[bin]]
name = "jadix-hot-reload"
path = "src/cli/main.rs"
required-features = ["cli"]

[dependencies]
syn = { workspace = true, optional = true }
proc-macro2 = { workspace = true, features = ["span-locations"], optional = true }
serde.workspace = true
serde_json.workspace = true

notify = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
