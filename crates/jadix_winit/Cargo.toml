[package]
name = "jadix_winit"
version = "0.31.0-beta.3-jadix.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository.workspace = true
description = "Jadix's Winit facade fork with a unified OpenHarmony backend"
publish = false

[features]
default = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"]
android-game-activity = ["winit-android/game-activity"]
android-native-activity = ["winit-android/native-activity"]
mint = ["dpi/mint"]
private-apple-apis = ["winit-appkit/private-apple-apis"]
serde = ["dep:serde", "cursor-icon/serde", "smol_str/serde", "dpi/serde", "bitflags/serde", "winit-core/serde", "winit-uikit/serde"]
wayland = ["dep:winit-wayland"]
wayland-csd-adwaita = ["winit-wayland/csd-adwaita"]
wayland-csd-adwaita-cosmic-text = ["winit-wayland/csd-adwaita-cosmic-text"]
wayland-csd-adwaita-crossfont = ["winit-wayland/csd-adwaita-crossfont"]
wayland-csd-adwaita-notitle = ["winit-wayland/csd-adwaita-notitle"]
wayland-csd-adwaita-notitlebar = ["winit-wayland/csd-adwaita-notitlebar"]
wayland-csd-adwaita-skrifa = ["winit-wayland/csd-adwaita-skrifa"]
wayland-dlopen = ["winit-wayland/dlopen"]
x11 = ["dep:winit-x11"]
ohos-window-plugin = ["winit-ohos/plugin-window"]
ohos-native-vsync = ["winit-ohos/native-vsync"]
ohos-extended-plugins = ["winit-ohos/extended-plugins"]

[build-dependencies]
cfg_aliases = "0.2.2"

[dependencies]
bitflags = "2"
cursor-icon = "1.1"
dpi = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }
rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"] }
serde = { version = "1", features = ["serde_derive"], optional = true }
smol_str = "0.3"
tracing = { version = "0.1.40", default-features = false }
winit-core = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }

[target.'cfg(target_os = "android")'.dependencies]
winit-android = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }

[target.'cfg(target_env = "ohos")'.dependencies]
winit-ohos = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
winit-appkit = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSUserDefaults", "NSString", "NSGeometry"] }
objc2-app-kit = { workspace = true, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dependencies]
winit-uikit = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }

[target.'cfg(target_os = "windows")'.dependencies]
winit-win32 = { path = "../../vendor/winit-win32", version = "=0.31.0-beta.3" }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_vendor = "apple", target_env = "ohos"))))'.dependencies]
libc = { workspace = true }
rustix = { version = "1.0.7", default-features = false, features = ["std", "thread"] }
winit-common = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83", features = ["xkb"] }
winit-wayland = { path = "../../vendor/winit-wayland", version = "=0.31.0-beta.3", optional = true, default-features = false }
winit-x11 = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83", optional = true }

[target.'cfg(target_os = "redox")'.dependencies]
winit-orbital = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }

[target.'cfg(target_family = "wasm")'.dependencies]
winit-web = { git = "https://github.com/rust-windowing/winit.git", rev = "758a50e35a928dbf72bf05ae91f12fee7a540a83" }
