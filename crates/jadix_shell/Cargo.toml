[package]
name = "jadix_shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Experimental Jadix shell session ownership, grants and cancellable host requests"
readme = "README.md"

[features]
default = []
native-vm = ["dep:rquickjs"]
native-host = ["dep:jadix_native"]
native-store = []

[dependencies]
jadix_core.workspace = true
jadix_native = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { version = "=0.14.0", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
jadix_native.workspace = true
