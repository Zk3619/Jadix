[package]
name = "jadix"
version.workspace = true
edition.workspace = true
description = "Pure-Rust native UI framework with fine-grained reactivity and optional static UI macros"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "wgpu", "reactive", "desktop"]
categories = ["gui"]

# Ship workspace LICENSE + bundled-asset attributions with the crate tarball.
include = ["/Cargo.toml", "/LICENSE", "/NOTICE", "/MOTION.md", "/SCALE_PREVIEW.md", "/THEMES.md", "/DOCUMENT_EDITING.md", "/TEXT_DOCUMENT_VIEWS.md", "/build.rs", "/src/**/*", "/benches/**/*", "/tests/**/*", "/examples/**/*", "/README.md", "/README.zh.md", "/GUIDE.md"]

[features]
# Capability inventory and core/optional boundaries: docs/FEATURES.md.
default = ["macros", "backend-dx12", "backend-gles", "backend-metal", "window-materials", "theme-shadcn", "animation-base", "native-clipboard", "images", "file-persistence"]
macros = ["dep:jadix_macros"]
file-persistence = []
native-clipboard = ["dep:jadix_clipboard"]
product-tests = ["drag", "macros"]
drag = []
theme-shadcn = ["jadix_theme/theme-shadcn"]
theme-fluent = ["jadix_theme/theme-fluent"]
theme-material3 = ["jadix_theme/theme-material3"]
theme-liquid-glass = ["jadix_theme/theme-liquid-glass"]
themes = ["theme-shadcn", "theme-fluent", "theme-material3", "theme-liquid-glass"]
animation-base = ["jadix_animation/animation-base"]
animation-ex = ["animation-base", "jadix_animation/animation-ex"]
animation = ["animation-base", "animation-ex"]
animation-path = ["animation-ex", "svg", "jadix_animation/animation-path"]
code = []
code-lsp = ["dep:jadix_lsp"]
markdown = ["jadix_document/markdown"]
document = ["markdown"]
document-editing = ["document", "jadix_document/document-editing"]
document-diff = ["jadix_document/diff"]
document-science = ["document", "jadix_document/science"]
file-dialog = ["dep:rfd"]
gallery-tests = ["product-tests", "text-undo", "svg", "themes", "animation-path", "code", "scale-preview", "windows-dcomp", "document-editing", "document-diff", "document-science", "file-dialog"]
window-materials = ["jadix_window_materials/windows-dcomp", "windows-dwm", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
windows-dwm = ["windows-sys/Win32_Graphics_Dwm", "windows-sys/Win32_UI_Controls"]
windows-composition = ["backend-dx12", "dep:windows", "dep:windows-core", "dep:windows-numerics", "dep:windows-collections"]
windows-dcomp = ["window-materials", "windows-composition"]
native-materials = ["window-materials"]
scale-preview = []
# Framework performance sampling capability (enabled by Gallery for its diagnostics UI).
# Applications that do not need performance telemetry leave this feature disabled.
performance = []
# Entire `src/i18n` module (catalogs, locale overlay, ICU4X format). Off by default.
# Component chrome uses `tr_default` / `tr_with_default`, which return the source
# string when this feature is off. Enable: cargo test -p jadix --lib --features i18n
i18n = ["dep:icu", "dep:icu_provider_blob", "dep:writeable"]
# AccessKit tree + local 0.31 winit hook. Off by default.
# Element `accesskit_*` attrs still compile; the bridge is feature-gated.
# Enable: cargo test -p jadix --lib --features a11y
# `accesskit_winit` still tracks winit 0.30. The OS hook is in-tree
# (`a11y::winit_adapter`) with a Windows subclass and OHOS native ArkUI provider.
a11y = ["dep:accesskit", "dep:accesskit_windows", "dep:jadix_accesskit_ohos"]
# Dev-time TCP hot reload (`jadix_hot_reload_cli`). Requires debug build.
hot-reload = []
# Optional runtime logger: console (stderr) + optional file via JADIX_LOG_FILE (env_logger).
runtime-logging = ["dep:env_logger"]
# Optional structured spans on hot paths (layout / reconcile). Off by default.
tracing = ["dep:tracing"]
# Native system tray via tray-icon + muda. Off by default (see docs/ops/tray.md).
system-tray = ["dep:tray-icon"]
# OS menu bars on Windows/macOS. Linux winit windows are not GTK windows.
native-menu = ["dep:muda"]
webview = ["windows-composition", "dep:webview2-com", "dep:wry", "dep:gtk", "dep:jni", "dep:objc2", "dep:objc2-foundation", "dep:html5ever", "dep:base64"]
# Windows defaults to D3D12 for predictable presentation and 4K frame throughput.
# GL remains the fallback; lean consumers can disable default features.
# This adds native backend code and driver memory (ADR-3, 2026-10-16 update).
backend-dx12 = ["jadix_renderer/backend-dx12", "wgpu/dx12"]
# Optional Vulkan backend (kept off by default to avoid multi-backend bloat on Windows).
backend-vulkan = ["wgpu/vulkan"]
backend-gles = ["wgpu/gles"]
backend-metal = ["wgpu/metal"]
# Translated D3D11: WGSL -> GLSL -> ANGLE -> hardware D3D11.
# Native graphics HAL and ANGLE are independently selectable.
# Experimental: native-window color and sustained presentation are not accepted yet.

# Experimental native SM5 graphics subset; see vendor/wgpu-hal/JADIX_DX11_PATCH.md.
backend-dx11-native = ["jadix_renderer/backend-dx11-native", "dep:wgpu-hal", "wgpu-hal/dx11"]
backend-dx11-angle = ["jadix_renderer/backend-dx11-angle", "backend-gles", "dep:wgpu-hal", "wgpu-hal/gles-angle"]
backend-dx11 = ["backend-dx11-native"]
# Embed large fonts into the binary (single-file distro; dramatically increases size).
bundled-cjk = []
bundled-cjk-serif = []
bundled-emoji = []
bundled-symbols = []
bundled-fonts = ["bundled-cjk", "bundled-cjk-serif", "bundled-emoji", "bundled-symbols"]
# Load optional fonts from disk at runtime (JADIX_FONT_DIR / assets/), without embedding.
fonts-cjk = []
fonts-cjk-serif = []
fonts-emoji = []
# Public `<svg>` / SMIL / resvg raster (Image · CSS cursor · AnimatedIcon frames) + MorphIcon.
# Not in default. Path kernel (Chart, ProgressCircle) stays without this feature.
svg = ["dep:resvg"]
document-math = ["document", "svg", "jadix_document/document-math"]
syntax-highlighting = ["jadix_document/syntax"]
# Twemoji SVG via the same resvg (PNG fallback remains without it).
emoji-svg = ["svg"]
# Extra raster codecs (off by default; PNG remains in the core set).
image-bmp = ["image/bmp"]
image-tiff = ["image/tiff"]
image-avif = ["image/avif"]
image-exr = ["image/exr"]
image-hdr = ["image/hdr"]
image-pnm = ["image/pnm"]
image-qoi = ["image/qoi"]
image-tga = ["image/tga"]
image-ff = ["image/ff"]
image-full = [
    "images",
    "image-bmp",
    "image-tiff",
    "image-avif",
    "image-exr",
    "image-hdr",
    "image-pnm",
    "image-qoi",
    "image-tga",
    "image-ff",
]
image-jpeg = ["image/jpeg"]
image-gif = ["image/gif"]
image-webp = ["image/webp"]
image-ico = ["image/ico"]
jpeg = ["image-jpeg"]
gif = ["image-gif"]
webp = ["image-webp"]
images = ["image-jpeg", "image-gif", "image-webp", "image-ico"]
cursor-images = []
# WP-3.13 experimental <scene3d> rotating cube. Off by default (volume / ADR-3).
scene3d = []
# Optional wgpu compute (blur / histogram / particles / backdrop-filter).
# Off by default so GLES / gallery / calculator stay fragment-only.
# Still adapter-gated: GLES reports compute: no even with this feature.
#   cargo run -p gallery --features compute
#   cargo test -p jadix --lib --features compute
# Workspace unification: do not enable from calculator / gpu_probe.
compute = []
# WP-M.3: YUV (NV12 / I420 / P010) → BT.709 RGBA for ImageStream. Off by default.
# Zero decoder crates — applications inject demux.
image-stream = []
# B1 runtime Inspector: Elements pick/highlight + Reactivity graph + style live edit.
# Opt-in; not in default release surface (see docs/ops/devtools.md).
devtools = ["scale-preview", "taffy/parse"]
# Allow `<Image src="https://…">` / Avatar / Icon to call an app-installed
# [`RemoteAssetFetcher`] (no HTTP crate). See docs/ops/remote_asset.md.
remote-asset = []
remote-asset-cache = ["remote-asset", "dep:moka"]
runtime-tokio = ["dep:jadix_tokio"]
net = ["dep:jadix_net"]
net-json = ["net", "jadix_net/json"]
# Input/Textarea undo+redo history. Off by default (lean crate). Gallery enables it.
# See docs/plans/text_undo_redo.md. Workspace feature unification: do not enable
# from calculator / gpu_probe; package-specific `cargo test -p jadix --lib` stays off.
text-undo = []
# P3 measured String vs ropey (ignored test `text_buffer_mid_insert` + text_undo_redo.md §9.3).
# Not enabled: L1/L2 stay on StringBuffer. Do not uncomment without new L3 numbers.
# text-undo-rope = ["text-undo", "dep:ropey"]

[dependencies]
jadix_document.workspace = true
jadix_core.workspace = true
jadix_layout.workspace = true
jadix_animation.workspace = true
jadix_theme.workspace = true
jadix_renderer.workspace = true
jadix_window_materials.workspace = true
jadix_hot_reload.workspace = true
jadix_lsp = { workspace = true, optional = true }
jadix_media.workspace = true
jadix_tasks.workspace = true
jadix_tokio = { workspace = true, optional = true }
moka = { workspace = true, optional = true, features = ["sync"] }
jadix_net = { workspace = true, optional = true }
winit = { workspace = true }
wgpu = { workspace = true }
wgpu-hal = { "package" = "jadix_wgpu_hal", "version" = "=30.0.0", "path" = "../../vendor/wgpu-hal", "default-features" = false, "optional" = true }
taffy = { workspace = true, features = ["parse"] }
bytemuck = { workspace = true }
glyphon = { workspace = true }
env_logger = { workspace = true, optional = true }
log = { workspace = true }
tracing = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
icu = { workspace = true, optional = true, features = [
    "compiled_data",
    "sync",
    "serde",
    "unstable",
] }
icu_provider_blob = { workspace = true, optional = true, features = ["alloc"] }
writeable = { workspace = true, optional = true }
jadix_macros = { workspace = true, optional = true }
jadix_style_tokens = { workspace = true }
stacker = { workspace = true }
jadix_clipboard = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
swash = { workspace = true }
ttf-parser = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-linebreak = { workspace = true }
html5ever = { version = "0.39", optional = true }
base64 = { version = "0.22", optional = true }
latex-rust = { workspace = true, optional = true }
image = { workspace = true }
resvg = { workspace = true, optional = true }


[target.'cfg(target_env = "ohos")'.dependencies]
openharmony-ability = { workspace = true }
jadix_accesskit_ohos = { path = "../jadix_accesskit_ohos", version = "0.1.0", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true, optional = true }
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Window",
] }
wasm-bindgen = { workspace = true }
wgpu = { workspace = true, "features" = ["webgpu", "webgl"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
objc2-app-kit = { workspace = true, optional = true, default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
muda = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.39.1", optional = true }
accesskit_windows = { version = "0.34.0", optional = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { workspace = true, optional = true, features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct2D_Common",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Foundation",
    "Graphics_Effects",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct2D",
    "Win32_Security",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics",
    "Win32_System_WinRT_Graphics_Direct2D",
] }
windows-core = { workspace = true, optional = true }
windows-numerics = { workspace = true, optional = true }
windows-collections = { workspace = true, optional = true }

[dev-dependencies]
jadix_hot_reload = { workspace = true, features = ["syntax"] }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
# Used by ignored `text_buffer_mid_insert` (P3 String vs ropey). Not a product dependency.
ropey = { workspace = true }
jadix_animation = { workspace = true, features = ["test-hooks"] }
jadix_renderer = { workspace = true, features = ["test-hooks"] }

[[bench]]
name = "layout_baseline"
harness = false

# System native WebViews. Windows retains composition for portal support.
[target.'cfg(any(target_os = "macos", target_os = "ios", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
wry = { workspace = true, optional = true }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
gtk = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true, features = ["ksni"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true, features = ["NSGeometry"] }


[target.'cfg(any(target_os = "windows", target_os = "macos", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
rfd = { workspace = true, optional = true }

[[test]]
name = "drag_routing_contracts"
required-features = ["drag"]


[[test]]
name = "anchored_overlay_rsx"
required-features = ["macros"]

[[test]]
name = "backdrop_blur_rsx"
required-features = ["macros"]

[[test]]
name = "format_bind_text"
required-features = ["macros"]

[[test]]
name = "viewport_modal_rsx"
required-features = ["macros"]
