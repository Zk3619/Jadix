[package]
name = "jadix_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reactive ownership, signals and stores without a UI or renderer"
readme = "README.md"

[features]
default = []
system-environment = ["dep:windows-sys", "dep:libc"]

[dependencies]
log.workspace = true
stacker.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "=0.22.1"
unicode-segmentation.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Time", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
libc = { workspace = true, optional = true }

