[package]
name = "@NAME@"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[profile.dev]
debug = 0

[lib]
name = "jadix_native_controls"
crate-type = ["cdylib", "rlib"]

[dependencies]
jadix_components = { path = "@ROOT@/crates/jadix_components", default-features = false, features = ["macros", "theme-shadcn"] }
jadix_core = { path = "@ROOT@/crates/jadix_core" }
jadix_native = { path = "@ROOT@/crates/jadix_native", features = ["ohos"] }
serde_json = "1"

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = "1.2"
napi-derive-ohos = "1.2"

[build-dependencies]
napi-build-ohos = "1.2"
