[package]
name = "@NAME@"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
jadix_components = { path = "@ROOT@/crates/jadix_components", default-features = false, features = ["macros", "i18n"] }
jadix_core = { path = "@ROOT@/crates/jadix_core" }
jadix_native = { path = "@ROOT@/crates/jadix_native", features = ["appkit", "i18n", "performance"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
