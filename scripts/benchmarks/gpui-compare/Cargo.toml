[package]
name = "gpui-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
fast = ["gpui-kit/gpui-fast", "dep:gpui-fast-windows"]

[dependencies]
gpui-kit = { path = "../../../Reference/gpui-kit-main/crates/kit", default-features = false }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi_Common"] }
gpui-pre-windows = { version = "=0.3.9", default-features = false, features = ["benchmark-gpu-identity"] }
gpui-fast-windows = { version = "=0.1.9", default-features = false, optional = true, features = ["benchmark-gpu-identity"] }

[patch.crates-io]
gpui-pre-windows = { path = "../../../vendor/gpui-pre-windows-0.3.9" }
gpui-fast-windows = { path = "../../../vendor/gpui-fast-windows-0.1.9" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
strip = "symbols"
panic = "abort"
