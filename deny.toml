# License policy for RUI workspace crates.
# Run: cargo deny check licenses
# See docs/ops/PUBLISH.md §2.1

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "BSL-1.0",
]
confidence-threshold = 0.8
# v2: only `allow` is used; GPL/LGPL/AGPL are rejected because they are not listed.

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
