[package]
name = "d3d11_probe"
version.workspace = true
edition.workspace = true
publish = false

[features]
native-wgpu = ["native-hal", "angle"]
angle = ["dep:wgpu", "dep:glow", "dep:raw-window-handle", "wgpu/gles-angle"]
native-hal = ["dep:wgpu", "wgpu/dx11", "wgpu/naga-ir", "wgpu/wgsl"]

[dependencies]
serde_json.workspace = true
glow = { version = "0.17", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { workspace = true, "optional" = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
