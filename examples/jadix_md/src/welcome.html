<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
body{max-width:780px;margin:40px auto;padding:0 28px;font:17px/1.8 system-ui;color:#24292f}h1{border-bottom:2px solid #ddd}table{border-collapse:collapse;width:100%}td,th{border:1px solid #cbd5e1;padding:10px}th{background:#eef2ff}aside{padding:16px;background:#f0fdf4;border-left:4px solid #22c55e}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}
</style></head><body><h1>真正的 HTML 文档</h1><p>可以直接编辑<strong>粗体</strong>、<em>斜体</em>、<u>下划线</u>和<span style="color:#7c3aed;font-size:24px">带 CSS 样式的文字</span>。</p><div class="columns"><aside>保留嵌套 DOM、样式表、实体与段落结构。</aside><p>公式字符：H<sub>2</sub>O、x<sup>2</sup>。<a href="https://example.com">链接</a>保存在 HTML 中。</p></div><table><thead><tr><th colspan="2">可编辑的合并单元格</th></tr></thead><tbody><tr><td>左侧</td><td>右侧</td></tr></tbody></table><ul><li>列表项目</li><li><strong>嵌套样式</strong></li></ul><p>使用「保存」导出完整 HTML。导入的脚本不会执行。</p></body></html>
