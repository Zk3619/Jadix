<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadix Web Gallery</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101014; color: #fafafa; font-family: sans-serif; }
    #jadix-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #status { position: fixed; inset: 24px auto auto 24px; max-width: min(600px, calc(100% - 48px)); white-space: pre-wrap; }
    #status[hidden] { display: none; }
    #jadix-startup { position: fixed; inset: 0; display: grid; place-items: center; background: #171717; color: #fafafa; }
    #jadix-startup[hidden] { display: none; }
    @media (prefers-color-scheme: light) { #jadix-startup { background: #fafafa; color: #171717; } }
  </style>
</head>
<body data-state="loading">
  <canvas id="jadix-canvas" aria-label="Jadix Web Gallery"></canvas>
  <div id="jadix-startup" role="status" aria-live="polite">Loading Jadix...</div>
  <div id="status" role="status" hidden></div>
  <script type="module">
    const status = document.querySelector('#status');
    const mode = new URLSearchParams(location.search).get('splash') || 'component';
    document.body.dataset.startupMode = mode;
    if (mode === 'off') document.querySelector('#jadix-startup').hidden = true;
    const fail = (error) => {
      status.hidden = false;
      status.textContent = `Jadix could not start.\n${error?.stack || error}`;
      document.body.dataset.state = 'error';
      document.querySelector('#jadix-startup').hidden = true;
    };
    window.addEventListener('error', (event) => fail(event.error || event.message));
    window.addEventListener('unhandledrejection', (event) => fail(event.reason));
    try {
      const { default: init } = await import('./pkg/gallery_web.js');
      await init();
    } catch (error) {
      fail(error);
    }
  </script>
</body>
</html>
