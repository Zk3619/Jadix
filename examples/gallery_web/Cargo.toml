[package]
name = "gallery_web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jadix.workspace = true
gallery = { path = "../gallery", default-features = false, features = ["scene3d", "image-stream"] }
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["console", "Window", "Location"] }
