[package]
name = "gpu_probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Diagnostic-only: measures the memory floor of winit + wgpu with no jadix code,
# so framework-side allocations can be separated from driver-side ones.
# Windows default backend is GL (ADR-3); use PROBE_BACKEND=dx12 with --features dx12 to compare.

[features]
default = []
# Off by default on purpose: cargo unifies features across a workspace build, so
# enabling it here unconditionally would drag the D3D12 backend back into every
# other binary. Turn it on only for a one-off `PROBE_BACKEND=dx12` comparison.
dx12 = ["wgpu/dx12"]

[dependencies]
winit = { workspace = true }
# GL and Vulkan are on in the workspace wgpu features; DX12 still needs `dx12`.
wgpu = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
