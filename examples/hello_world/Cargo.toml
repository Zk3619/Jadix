[package]
name = "hello_world"
version = "0.1.0"
edition = "2021"

[dependencies]
# Keep lucide embedded so Icon PUA glyphs never tofu when cwd ≠ workspace.
# Twemoji PNGs are still loaded from disk (see prepare_text::twemoji_dir).
rui = { path = "../../crates/rui", default-features = false, features = ["bundled-lucide"] }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
bytemuck = { workspace = true }
taffy = { workspace = true }
glyphon = { workspace = true }
