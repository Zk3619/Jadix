[package]
name = "harmonyos_host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "OpenHarmony Ability entry (gpui-template contract). Build with ohrs on target_env=ohos."

[features]
a11y = ["jadix/a11y"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jadix = { workspace = true, features = ["backend-dx12", "backend-gles", "backend-metal", "theme-shadcn"] }

[target.'cfg(target_env = "ohos")'.dependencies]
openharmony-ability = { workspace = true }
openharmony-ability-derive = { workspace = true }
napi-ohos = { workspace = true }
napi-derive-ohos = { workspace = true }
log = { workspace = true }

[build-dependencies]
napi-build-ohos = { workspace = true }
