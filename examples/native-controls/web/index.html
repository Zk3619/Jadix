<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadix native controls</title>
<style>body{margin:0}#app{width:100vw;height:100dvh;min-height:480px}</style>
<div id="app"></div>
<script type="module">
import init, {mount, resize, state, unmount, take_error} from './pkg/jadix_native_controls.js';
await init();
mount('app');
window.jadixNative = {state, unmount, mount, take_error};
let environment = 1;
const update = () => resize(innerWidth, innerHeight, ++environment);
addEventListener('resize', update);
document.fonts.addEventListener('loadingdone', update);
await document.fonts.ready;
update();
</script>
</html>
