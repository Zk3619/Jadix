[package]
name = "jadix-frame-compare"
version.workspace = true
edition.workspace = true
publish = false

[features]
dx11 = ["jadix/backend-dx11", "dep:wgpu-hal", "wgpu-hal/dx11"]
dx11-angle = ["jadix/backend-dx11-angle"]

[dependencies]
wgpu-hal = { version = "30", default-features = false, optional = true }
jadix = { workspace = true, features = ["a11y", "performance"] }
winit.workspace = true
serde_json.workspace = true
wgpu.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }
