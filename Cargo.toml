[workspace]
members = ["crates/*", "examples/*"]
resolver = "2"

[workspace.dependencies]
winit = "0.30"
accesskit = "0.22"
accesskit_winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
] }
taffy = "0.6"
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
palette = "0.7"
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.6.0"
# WGSL only. On Windows wgpu already force-links the Vulkan + GLES backends via its
# own target cfg, so GL (the low-memory default) and Vulkan (fallback) stay available;
# opting out of `dx12` additionally drops wgpu-hal's D3D12 path and the DXC compiler.
wgpu = { version = "22.1", default-features = false, features = ["wgsl"] }
cosmic-text = "0.12.1"
swash = "0.1.19"
fontdb = "0.16.2"
ttf-parser = "0.21.1"
unicode-segmentation = "1.11.0"
# Text-only clipboard: the default `image` feature drags in image 0.25 with
# bmp/png/jpeg decoders that nothing here calls.
clipboard-rs = { version = "0.3", default-features = false }
rfd = "0.15"
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
# Extreme size: "z" over "s". Fat LTO deletes more dead code (slower / hungrier link).
opt-level = "z"
lto = true
strip = true
panic = "abort"
