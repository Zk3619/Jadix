[workspace]
members = ["crates/*", "examples/*"]
exclude = ["examples/config", "vendor/glyphon", "vendor/taffy", "vendor/naga", "vendor/wgpu-core", "vendor/wgpu-types", "vendor/wgpu-hal", "vendor/gpui-pre-windows-0.3.9", "vendor/gpui-fast-windows-0.1.9", "vendor/winit-wayland", "vendor/winit-win32", "vendor/wgpu", "vendor/wgpu-core-deps-apple", "vendor/wgpu-core-deps-emscripten", "vendor/wgpu-core-deps-wasm", "vendor/wgpu-core-deps-windows-linux-android", "vendor/wgpu-naga-bridge", "vendor/winit-android", "vendor/winit-appkit", "vendor/winit-common", "vendor/winit-core", "vendor/winit-ohos", "vendor/winit-orbital", "vendor/winit-uikit", "vendor/winit-web", "vendor/winit-x11"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Zk3619/Jadix"

# Single source of truth for versions. Member crates use `{ workspace = true }`
# plus crate-local features / optional. Package features and optionality remain local.
[workspace.dependencies]
jadix_window_materials = { path = "crates/jadix_window_materials", version = "0.1.0", default-features = false }
jadix_renderer = { path = "crates/jadix_renderer", version = "0.1.0", default-features = false }
jadix_theme = { path = "crates/jadix_theme", version = "0.1.0", default-features = false }
jadix_animation = { path = "crates/jadix_animation", version = "0.1.0", default-features = false }
jadix_layout = { path = "crates/jadix_layout", version = "0.1.0", default-features = false }
jadix_core = { path = "crates/jadix_core", version = "0.1.0", default-features = false }
# --- path crates (version required so they are not `*` wildcards for cargo-deny / publish) ---
jadix = { path = "crates/jadix", version = "0.1.0", default-features = false }
jadix_components = { path = "crates/jadix_components", version = "0.1.0", default-features = false }
jadix_dnd = { path = "crates/jadix_dnd", version = "0.1.0", default-features = false }
jadix_macros = { path = "crates/jadix_macros", version = "0.1.0" }
jadix_style_tokens = { path = "crates/jadix_style_tokens", version = "0.1.0" }
jadix_window_state = { path = "crates/jadix_window_state", version = "0.1.0" }
jadix_clipboard = { path = "crates/jadix_clipboard", version = "0.1.0", default-features = false }
jadix_media = { path = "crates/jadix_media", version = "0.1.0" }
jadix_lucide = { path = "crates/jadix_lucide", version = "0.1.0", default-features = false }
jadix_lsp = { path = "crates/jadix_lsp", version = "0.1.0" }
jadix_document = { path = "crates/jadix_document", version = "0.1.0", default-features = false }
jadix_hot_reload = { path = "crates/jadix_hot_reload", version = "0.1.0", default-features = false }
jadix_net = { path = "crates/jadix_net", version = "0.1.0", default-features = false }
jadix_tasks = { path = "crates/jadix_tasks", version = "0.1.0" }
jadix_tokio = { path = "crates/jadix_tokio", version = "0.1.0" }
tokio = { version = "1.53.3", default-features = false }
moka = { version = "0.12.16", default-features = false }

# --- window / GPU ---
# Local facade fork; backends/core are pinned together (see jadix_winit/README.md).
winit = { package = "jadix_winit", path = "crates/jadix_winit", version = "0.31.0-beta.3-jadix.1" }
winit-ohos = { "package" = "jadix_winit_ohos", "version" = "=0.31.0-beta.3-jadix.1", "path" = "vendor/winit-ohos", "default-features" = false }
wry = "=0.57.0"
gtk = "0.18"
jni = "0.21.1"
web-sys = "0.3"
wasm-bindgen = "0.2"
# HarmonyOS Ability (gpui-template / ohos-rs). Only used on `target_env = "ohos"`.
openharmony-ability = "=1.0.0-beta.3"
openharmony-ability-derive = "=1.0.0-beta.3"
napi-ohos = "1.2"
napi-derive-ohos = "1.2"
napi-build-ohos = "1.2"
accesskit = "0.24.1"
# wgpu 30 gates native backends behind features (unlike 22, which force-linked
# Vulkan+GLES on Windows). Backends are selected by each consumer; jadix enables DX12 for the
# Windows frame path. Vulkan stays opt-in.
# glyphon 0.12 pins wgpu 30 + cosmic-text 0.19; swash/ttf-parser follow that stack.
wgpu = { "package" = "jadix_wgpu", "version" = "=30.0.0", "path" = "vendor/wgpu", "default-features" = false, "features" = ["std", "parking_lot", "wgsl"] }

# --- layout / text ---
taffy = { "package" = "jadix_taffy", "version" = "=0.15.0", "path" = "vendor/taffy" }
bytemuck = { version = "1.25", features = ["derive"] }
# Upstream glyphon 0.12 (Coverage only). CSS transform text uses Bake/Msdf offscreen path.
glyphon = { "package" = "jadix_glyphon", "version" = "=0.12.0", "path" = "vendor/glyphon", "default-features" = false }
# Stack pin (not a direct dep). glyphon re-exports `glyphon::cosmic_text`.
cosmic-text = { package = "jadix_cosmic_text", version = "=0.19.0", path = "vendor/cosmic-text" }
swash = "0.2.6"
ttf-parser = "0.25"
unicode-segmentation = "1.11.0"
unicode-linebreak = "0.1.5"
similar = { version = "2.7", default-features = false, features = ["text"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
latex-rust = "=2.1.1"

# --- logging / serde ---
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# --- macros ---
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"

# --- desktop helpers ---
# Clipboard lives in `jadix_clipboard` (fork of clipboard-rs; Windows → `windows` 0.62).
clipboard-win = { version = "5.4", features = ["monitor"] }
x11rb = { version = "0.13", features = ["xfixes"] }
# objc2 0.6 matches rfd / wgpu-hal / winit 0.31.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-ui-kit = "0.3"
rfd = "0.17.2"
# default-features off: skip Linux libxdo / libappindicator. gtk still required on Linux if this feature is on.
# 0.25 + muda 0.20 accept windows-sys 0.61 (range >=0.60, <=0.61).
tray-icon = { version = "0.25", default-features = false }
muda = { version = "0.20", default-features = false }
# 8.2 pins windows-sys ^0.60.1 (cannot pick 0.61). 9.0.0-rc.5 is the first line that pins 0.61.
notify = "9.0.0-rc.5"
# Scoped grow around `app_builder` / `ui!` (Windows PE ~1 MiB). Not a PE `/STACK` bump.
stacker = "0.1"

# --- media ---
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = "0.48.1"
# Used by ignored `text_buffer_mid_insert` (P3 String vs ropey). Not a product dependency.
ropey = "1.6"

# --- i18n (feature `i18n`) ---
icu = { version = "2.3.1", default-features = false }
icu_provider_blob = { version = "2.3", default-features = false }
writeable = "0.6"

# --- platform ---
libc = "0.2"
windows-sys = "0.61"
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
windows-collections = "0.3"
find-msvc-tools = "0.1.9"

[profile.release]
codegen-units = 1
# Optimize per-frame CPU work; retain fat LTO to eliminate unused code.
opt-level = 3
lto = "fat"
debug = false
split-debuginfo = "off"
strip = "symbols"
panic = "abort"

# Fast local iteration: light optimization keeps tests responsive without the
# compile-time cost of many per-package optimization overrides.
[profile.dev]
opt-level = 1
debug = 1
codegen-units = 256
incremental = true

[profile.test]
inherits = "dev"
opt-level = 1
debug = 1
codegen-units = 256
incremental = true
