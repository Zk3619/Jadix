[workspace]
members = ["crates/*", "examples/*"]
resolver = "2"

[workspace.dependencies]
winit = "0.30"
accesskit = "0.22"
accesskit_winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
] }
taffy = "0.6"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
palette = "0.7"
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.12.0"
# wgpu 30 gates native backends behind features (unlike 22, which force-linked
# Vulkan+GLES on Windows). Keep GL/Vulkan/Metal on by default; DX12 stays behind
# `rui/backend-dx12` so the extra ~520 KiB and DXC stay opt-in.
# glyphon 0.12 pins wgpu 30 + cosmic-text 0.19; swash/fontdb/ttf-parser follow that stack.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "gles",
    "vulkan",
    "metal",
] }
cosmic-text = "0.19"
swash = "0.2.6"
fontdb = "0.23"
ttf-parser = "0.25"
unicode-segmentation = "1.11.0"
# Text-only clipboard: the default `image` feature drags in image 0.25 with
# bmp/png/jpeg decoders that nothing here calls.
clipboard-rs = { version = "0.3", default-features = false }
rfd = "0.15"
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
# Extreme size: "z" over "s". Fat LTO deletes more dead code (slower / hungrier link).
opt-level = "z"
lto = true
strip = true
panic = "abort"
