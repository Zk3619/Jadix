name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  documentation-and-test-layout:
    name: documentation + test ownership
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon test dependency
        run: python -m pip install Pillow PyYAML
      - uses: dtolnay/rust-toolchain@stable
      - name: Workflow package, feature and script references
        run: python scripts/checks/check-ci-workflow.py --tracked-only --output target/governance/ci-workflow.json
      - name: Tool contracts
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Test ownership
        run: python scripts/checks/check-test-layout.py --output target/governance/test-layout.json
      - name: Public documentation
        run: python scripts/checks/check-public-docs.py --output target/governance/public-docs.json

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: Clippy (remote-asset)
        run: cargo clippy -p jadix --all-targets --no-deps --features remote-asset -- -D warnings
      - name: Clippy (image-stream)
        run: cargo clippy -p jadix --all-targets --no-deps --features image-stream -- -D warnings
      - name: Clippy (text-undo)
        run: cargo clippy -p jadix --all-targets --no-deps --features text-undo -- -D warnings
      - name: Clippy (combined optional features)
        run: cargo clippy -p jadix --all-targets --no-deps --features remote-asset,image-stream,text-undo -- -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: License + dependency policy (deny.toml)
        run: cargo deny check licenses bans sources

  test:
    needs: [documentation-and-test-layout, lint]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev pkg-config mesa-vulkan-drivers
      - name: PowerShell tool contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/tests/test_application_frame_budget.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Frame-budget tool contracts failed' }
          pwsh -NoProfile -File scripts/tests/test_acceptance_powershell.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance runner contracts failed' }
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Window backend dependency identities
        shell: pwsh
        run: ./scripts/checks/check-window-deps.ps1
      - name: Isolated capabilities and minimal dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/checks/check-features.ps1
          cargo test -p jadix --no-default-features --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix --no-default-features --test animation_features --test optional_macros -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix --no-default-features --features drag --test drag_routing_contracts -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix_components --no-default-features --features macros,dnd --tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix --features gallery-tests --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix --no-default-features --features macros --lib --test optional_macros -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/checks/check-optional-macros.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/checks/check-authoring.ps1
          ./scripts/checks/check-dnd-source.ps1
          cargo test -p jadix_dnd --features macros --tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix_lucide --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix_lucide --features animated,svg,macros --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/checks/check-product-distributions.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/checks/check-extracted-kernels.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($capability in @('theme-fluent', 'theme-material3', 'theme-liquid-glass', 'code', 'markdown', 'syntax-highlighting', 'code-lsp', 'scale-preview', 'windows-dwm', 'windows-dcomp', 'svg')) {
            cargo test -p jadix --no-default-features --features $capability --test feature_contracts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($capability in @('animation-base', 'animation-ex', 'animation', 'animation-path', 'svg', 'svg,animation-base', 'svg,animation-ex')) {
            cargo test -p jadix --no-default-features --features $capability --test animation_features -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo test -p jadix --no-default-features --features product-tests,svg --lib utils::morph_icon -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix --no-default-features --features gallery-tests --lib utils::icon_provider::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix --lib anim_freeze -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix_lsp --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix_components --no-default-features --features macros,scale-preview --test scale_preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p jadix_components --features macros,themes,animation-path,document-editing,document-diff,document-science --tests
      - name: Wayland configure capability projection
        if: runner.os == 'Linux'
        run: cargo test -p jadix_winit --lib projects_real_configure
      - name: Test
        run: cargo test --workspace
      - name: Native menu contracts (Windows)
        if: runner.os == 'Windows'
        run: 'cargo test -p jadix --lib --features native-menu,system-tray native_menu:: -- --test-threads=1'
      - name: Native menu bridge + example (all hosts)
        run: cargo check -p jadix_components --features macros,jadix/native-menu --example desktop_shell
      - name: AccessKit bridge and OHOS node identities
        run: |
          cargo test -p jadix --lib --features a11y a11y:: -- --test-threads=1
          cargo test -p jadix_accesskit_ohos --lib
      - name: Window chrome + proxy contracts (all hosts)
        run: |
          cargo test -p jadix --lib --features native-menu window_chrome:: -- --test-threads=1
          cargo test -p jadix --lib --features native-menu title_bar:: -- --test-threads=1
          cargo test -p jadix --lib --features native-menu ui_bridge:: -- --test-threads=1
      - name: Native menu + tray coexistence (macOS)
        if: runner.os == 'macOS'
        run: cargo check -p jadix --features native-menu,system-tray
      - name: Box model contract (freeze)
        run: cargo test -p jadix --lib box_model -- --nocapture
      - name: Text measure contract (freeze)
        run: cargo test -p jadix --lib text_align_ -- --nocapture
      - name: CSS animation contract (freeze)
        run: cargo test -p jadix --lib anim_freeze -- --nocapture
      - name: Color contract (freeze)
        run: cargo test -p jadix --lib color_freeze -- --nocapture
      - name: Color space contract (freeze)
        run: cargo test -p jadix --lib color_space -- --nocapture
      - name: Token color audit (WP-STY.1)
        if: runner.os != 'Windows'
        run: bash scripts/checks/check-token-colors.sh
      - name: Token color audit (WP-STY.1)
        if: runner.os == 'Windows'
        run: powershell -File scripts/checks/check-token-colors.ps1
      - name: Text undo/redo contract (freeze)
        run: cargo test -p jadix --lib text_undo_freeze -- --nocapture
      - name: Text undo/redo contract (freeze, text-undo)
        run: cargo test -p jadix --lib --features text-undo text_undo_freeze -- --nocapture

  offscreen:
    needs: [documentation-and-test-layout, lint]
    name: offscreen smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      # Prefer a software adapter so headless runners without a GPU still exercise the pixel path.
      JADIX_FORCE_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev pkg-config mesa-vulkan-drivers
      - name: Offscreen clear/readback + golden
        run: cargo test -p jadix --lib offscreen -- --nocapture
      - name: ImageStream YUV GPU convert (WP-M.3)
        run: cargo test -p jadix --lib --features image-stream yuv_convert -- --nocapture
      - name: Component golden (WP-2.6)
        if: runner.os != 'Windows'
        # Serialize GPU device creation — software adapters dislike parallel request_device.
        run: cargo test -p jadix --features product-tests --lib golden_component -- --nocapture --test-threads=1
      - name: Component golden (WP-2.6, Windows WARP)
        if: runner.os == 'Windows'
        run: cargo test -p jadix --features backend-dx12,product-tests --lib golden_component -- --nocapture --test-threads=1
      - name: Library unit tests (smoke)
        # Golden / smoke companion: fast lib tests without full workspace matrix cost.
        run: cargo test -p jadix --lib -- --skip golden_component
      - name: Box model contract (freeze)
        run: cargo test -p jadix --lib box_model -- --nocapture
      - name: Text measure contract (freeze)
        run: cargo test -p jadix --lib text_align_ -- --nocapture
      - name: CSS animation contract (freeze)
        run: cargo test -p jadix --lib anim_freeze -- --nocapture
      - name: Color contract (freeze)
        run: cargo test -p jadix --lib color_freeze -- --nocapture
      - name: Color space contract (freeze)
        run: cargo test -p jadix --lib color_space -- --nocapture
      - name: Token color audit (WP-STY.1)
        if: runner.os != 'Windows'
        run: bash scripts/checks/check-token-colors.sh
      - name: Token color audit (WP-STY.1)
        if: runner.os == 'Windows'
        run: powershell -File scripts/checks/check-token-colors.ps1
      - name: Text undo/redo contract (freeze)
        run: cargo test -p jadix --lib text_undo_freeze -- --nocapture
      - name: Text undo/redo contract (freeze, text-undo)
        run: cargo test -p jadix --lib --features text-undo text_undo_freeze -- --nocapture
      - name: Remote-asset fetcher seam
        run: cargo test -p jadix --lib --features remote-asset remote -- --nocapture
      - name: ImageStream YUV (WP-M.3)
        run: cargo test -p jadix --lib --features image-stream yuv -- --nocapture
      - name: Text undo/redo history (text-undo)
        run: cargo test -p jadix --lib --features text-undo text_edit_history -- --nocapture
      - name: Document registry history (text-undo)
        run: cargo test -p jadix --lib --features text-undo document_registry -- --nocapture
