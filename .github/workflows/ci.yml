name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: Clippy (remote-asset)
        run: cargo clippy -p rui --all-targets --no-deps --features remote-asset -- -D warnings
      - name: Clippy (image-stream)
        run: cargo clippy -p rui --all-targets --no-deps --features image-stream -- -D warnings
      - name: Clippy (text-undo)
        run: cargo clippy -p rui --all-targets --no-deps --features text-undo -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev pkg-config mesa-vulkan-drivers
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Box model contract (freeze)
        run: cargo test -p rui --lib box_model -- --nocapture
      - name: CSS animation contract (freeze)
        run: cargo test -p rui --lib anim_freeze -- --nocapture
      - name: Color contract (freeze)
        run: cargo test -p rui --lib color_freeze -- --nocapture
      - name: Text undo/redo contract (freeze)
        run: cargo test -p rui --lib text_undo_freeze -- --nocapture
      - name: Text undo/redo contract (freeze, text-undo)
        run: cargo test -p rui --lib --features text-undo text_undo_freeze -- --nocapture

  offscreen:
    name: offscreen smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Prefer a software adapter so headless runners without a GPU still exercise the pixel path.
      RUI_FORCE_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev pkg-config mesa-vulkan-drivers
      - name: Offscreen clear/readback + golden
        run: cargo test -p rui --lib offscreen -- --nocapture
      - name: ImageStream YUV GPU convert (WP-M.3)
        run: cargo test -p rui --lib --features image-stream yuv_convert -- --nocapture
      - name: Component golden (WP-2.6)
        if: runner.os != 'Windows'
        # Serialize GPU device creation — software adapters dislike parallel request_device.
        run: cargo test -p rui --lib golden_component -- --nocapture --test-threads=1
      - name: Component golden (WP-2.6, Windows WARP)
        if: runner.os == 'Windows'
        run: cargo test -p rui --features backend-dx12 --lib golden_component -- --nocapture --test-threads=1
      - name: Library unit tests (smoke)
        # Golden / smoke companion: fast lib tests without full workspace matrix cost.
        run: cargo test -p rui --lib -- --skip golden_component
      - name: Box model contract (freeze)
        run: cargo test -p rui --lib box_model -- --nocapture
      - name: CSS animation contract (freeze)
        run: cargo test -p rui --lib anim_freeze -- --nocapture
      - name: Color contract (freeze)
        run: cargo test -p rui --lib color_freeze -- --nocapture
      - name: Text undo/redo contract (freeze)
        run: cargo test -p rui --lib text_undo_freeze -- --nocapture
      - name: Text undo/redo contract (freeze, text-undo)
        run: cargo test -p rui --lib --features text-undo text_undo_freeze -- --nocapture
      - name: Remote-asset fetcher seam
        run: cargo test -p rui --lib --features remote-asset remote -- --nocapture
      - name: ImageStream YUV (WP-M.3)
        run: cargo test -p rui --lib --features image-stream yuv -- --nocapture
      - name: Text undo/redo history (text-undo)
        run: cargo test -p rui --lib --features text-undo text_edit_history document_registry -- --nocapture
